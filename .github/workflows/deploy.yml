---
name: Deploy PortalAuto

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (standalone)
        run: |
          echo 'export default { output: "standalone" }' > next.config.mjs
          npm run build
          mkdir -p .out
          cp -r .next/standalone/* .out/
          mkdir -p .out/.next/static
          cp -r .next/static .out/.next/
          [ -d public ] && cp -r public .out/public || true
          [ -f package.json ] && cp package.json .out/
          [ -f package-lock.json ] && cp package-lock.json .out/
          [ -f ecosystem.config.cjs ] && cp ecosystem.config.cjs .out/

      - name: Add env file
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .out/.env

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete
          path: .out/
          remote_path: ${{ secrets.SSH_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_port: ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_KEY }}

      - name: PM2 reload
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SSH_PATH }}
            pm2 startOrReload ecosystem.config.cjs --env production
            pm2 save
            pm2 status
